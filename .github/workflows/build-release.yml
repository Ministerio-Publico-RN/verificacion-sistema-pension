name: Build y publicar ejecutable

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compilar frontend y empaquetar .exe
        shell: pwsh
        run: ./scripts/build_exe.ps1

      - name: Subir artefacto del build
        uses: actions/upload-artifact@v4
        with:
          name: VerificacionPrevisional-MPFN
          path: dist/VerificacionPrevisional-MPFN.exe

      - name: Publicar en GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          gh release create $env:GITHUB_REF_NAME dist/VerificacionPrevisional-MPFN.exe --title "Release $env:GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
